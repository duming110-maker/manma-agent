# 默认品牌配置。
# 构建入口：pnpm run dist -- --brand branding/default
#
# 设计：单一事实源，业务代码禁止出现品牌字面量（S7 grep 扫描）。
# 用户可见项随品牌变；代码标识符（npm scope、存储键、磁盘路径）固定。
# UI 文案字典按语言分键 { zh, en }。

product:
  # 产品名词典（docs/03 §9：UI 文案字典按语言分键）。中文「慢码」/ 西文
  # 「MANMA」不同名，按 { zh, en } 分键形式（UI 侧栏品牌名与 document.title
  # 按 locale 取值；packages/web-ui/build.mjs 亦接受单值形式并归一化）。
  name: { zh: "慢码", en: "MANMA" }

window:
  # 窗口标题兜底值（桌面解析器只接受单值字符串；页面加载后由 UI 按
  # locale 覆写 document.title）。
  title: "慢码"

theme:
  # 主色三档（亮色表）——P2-a 裁决：--bc-color-primary 系从 branding 取源，
  # build.mjs 构建期注入样式令牌表（非运行时读文件）。CSS 颜色值任意写法。
  primary: "rgb(37, 99, 235)"
  primaryHover: "rgb(29, 78, 216)"
  primaryActive: "rgb(30, 64, 175)"
  # 主色三档（暗色表变体）。
  primaryDark: "rgb(59, 130, 246)"
  primaryDarkHover: "rgb(96, 165, 250)"
  primaryDarkActive: "rgb(37, 99, 235)"
  # 注：暗色滚动条（--bc-scrollbar-thumb*）是派生值（demo 黑 thumb 在暗底
  # 不可见的适配），非品牌项——留在样式令牌表（styles.ts）标注，不进本表。

# P1-0 桌面壳品牌项（apps/desktop 构建与运行时消费；docs/03 §8/§9）。
# 注意：值必须是双引号字符串（packages/web-ui/build.mjs 的严格解析器只接受
# 双引号字符串或 { zh, en } flow map；布尔值写作 "true"/"false" 字符串）。
desktop:
  # 数据目录标识：per-brand 独立 DSH_HOME = %APPDATA%/<brandId>/dsh-home
  #（品牌间数据隔离 + 卸载可判定，docs/03 §9）。随品牌变。
  brandId: "manma"
  # electron-builder 稳定升级身份（AppUserModelId）。随品牌变。
  appId: "ai.manma.desktop"
  # 安装目录/快捷方式/窗口/进程显示名（ASCII）。随品牌变。
  productName: "MANMA"
  # 安装包文件名前缀（filesystem-safe，作为 NSIS artifactName 前缀）。随品牌变。
  executableName: "MANMA"
  # 应用图标（PNG ≥256）与托盘图标，相对 branding/<name>/ 目录。随品牌变。
  icon: "icon.png"
  trayIcon: "tray-icon.png"
  # 更新源 URL（P5 自动更新预留；空 = 不启用）。
  updateUrl: ""
  # 卸载时是否删除 %APPDATA%/<brandId>（「卸载干净」；字符串布尔）。
  uninstallerDeleteAppData: "true"
